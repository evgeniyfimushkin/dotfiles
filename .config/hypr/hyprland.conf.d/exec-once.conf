# Register the session before starting services that depend on portals.
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE && systemctl --user start hyprland-session.target && systemctl --user start waybar.service
exec-shutdown = systemctl --user stop hyprland-session.target
exec-once = wl-clip-persist --clipboard regular
exec-once = wl-paste --type text --watch cliphist store  # Stores only text data
exec-once = wl-paste --type image --watch cliphist store # Stores only image data
exec-once = mako
exec-once = hyprpaper
exec-once = hyprsunset
exec-once = xhost +SI:localuser:root
exec-once = nm-applet
exec-once = blueman-applet
exec-once = xdg-settings set default-web-browser firefox.desktop
